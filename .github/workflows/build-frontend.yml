name: Build Frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: .            # 假设仓库根目录即项目根目录

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'       # 与 deploy.sh 中 NODE_VERSION 一致
          cache: 'npm'
          cache-dependency-path: package-lock.json  # 或 yarn.lock

      - name: Configure npm mirror
        run: |
          npm config set registry https://registry.npmmirror.com
          npm config set electron_mirror https://npmmirror.com/mirrors/electron/
          npm config set electron_builder_binaries_mirror https://npmmirror.com/mirrors/electron-builder-binaries/
          npm config set puppeteer_download_host https://npmmirror.com/mirrors
          npm config set sass_binary_site https://npmmirror.com/mirrors/node-sass/

      - name: Install dependencies
        run: npm ci

      - name: Build frontend production
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'   # 内存充足，兜底避免 OOM
          VITE_API_BASE_URL: ''                       # 对应 deploy.sh 中的 env 设置
        run: |
          mkdir -p electron/build
          cp electron/public/favicon.ico electron/build/icon.ico 2>/dev/null || true
          npm run dashboard:build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: electron/dist-react/
          retention-days: 7